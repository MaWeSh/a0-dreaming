<html>
<head>
  <title>A0 Dreaming</title>
  <script type="module" src="/plugins/a0_dreaming/webui/store.js"></script>
  <style>
    .consolidation-item {
      transition: background 0.15s ease;
    }
    .consolidation-item:hover {
      background: var(--color-bg-tertiary, rgba(255,255,255,0.05)) !important;
    }
    .consolidation-item.selected {
      background: var(--color-bg) !important;
      border-left: 3px solid var(--color-primary, #6366f1);
    }
    .expand-btn {
      font-size: 0.8em;
      padding: 4px 10px;
      background: var(--color-bg-secondary);
      border: 1px solid var(--color-border);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .expand-btn:hover {
      background: var(--color-bg);
      border-color: var(--color-primary, #6366f1);
    }
    .selection-badge {
      font-weight: 600;
      font-size: 0.95em;
      padding: 6px 14px;
      background: var(--color-primary, #6366f1);
      color: white;
      border-radius: 16px;
    }
  </style>
</head>
<body>
<div x-data>
  <template x-if="$store.dreamingStore">
    <div x-init="$store.dreamingStore.onOpen()" x-destroy="$store.dreamingStore.cleanup()">
      
      <!-- STATISTICS -->
      <div class="section">
        <div class="section-title">Statistics</div>
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;">
          <div style="text-align: center; padding: 12px; background: var(--color-bg-secondary); border-radius: 8px;">
            <div style="font-size: 24px; font-weight: 600;" x-text="$store.dreamingStore.stats.sessions_analyzed"></div>
            <div style="opacity: 0.7; font-size: 0.9em;">Sessions</div>
          </div>
          <div style="text-align: center; padding: 12px; background: var(--color-bg-secondary); border-radius: 8px;">
            <div style="font-size: 24px; font-weight: 600;" x-text="$store.dreamingStore.stats.errors_found"></div>
            <div style="opacity: 0.7; font-size: 0.9em;">Errors Found</div>
          </div>
          <div style="text-align: center; padding: 12px; background: var(--color-bg-secondary); border-radius: 8px;">
            <div style="font-size: 24px; font-weight: 600;" x-text="$store.dreamingStore.stats.patterns_detected"></div>
            <div style="opacity: 0.7; font-size: 0.9em;">Patterns</div>
          </div>
        </div>
      </div>

      <!-- SENSITIVITY SECTION -->
      <div class="section">
        <div class="section-title">Detection Sensitivity</div>
        <div class="section-description">
          Configure how aggressively the dreamer detects error patterns in session history.
        </div>
        <div class="field">
          <div class="field-label">
            <div class="field-title">Sensitivity Level</div>
          </div>
          <div class="field-control" style="display: flex; flex-direction: row; align-items: center; gap: 16px;">
            <select x-model="$store.dreamingStore.sensitivity" style="min-width: 120px;">
              <option value="strict">Strict</option>
              <option value="moderate">Moderate</option>
              <option value="loose">Loose</option>
            </select>
            <span class="sensitivity-description" style="opacity: 0.8; font-size: 0.9em;"
                  x-text="$store.dreamingStore.sensitivityDescription"></span>
          </div>
        </div>
      </div>

      <!-- EXECUTION CONTROLS -->
      <div class="section">
        <div class="section-title">Execution Controls</div>
        <div class="field">
          <div class="field-label">
            <div class="field-title">Actions</div>
            <div class="field-description">Run analysis and manage dream sessions.</div>
          </div>
          <div class="field-control" style="display: flex; gap: 8px; flex-wrap: wrap;">
            <button class="btn" @click="$store.dreamingStore.runDetection()"
                    title="Analyze sessions for error patterns. Creates backup, no changes made."
                    :disabled="$store.dreamingStore.loading"
                    :class="{ 'loading': $store.dreamingStore.loading }">
              <span class="material-symbols-outlined" style="font-size: 18px;">search</span>
              Run Detection
            </button>
            <button class="btn" @click="$store.dreamingStore.runDream()"
                    title="Full session analysis with recommendations and insights."
                    :disabled="$store.dreamingStore.loading"
                    :class="{ 'loading': $store.dreamingStore.loading }">
              <span class="material-symbols-outlined" style="font-size: 18px;">psychology</span>
              Dream Analysis
            </button>
            <button class="btn" @click="$store.dreamingStore.saveDream()"
                    title="Store analysis results in Agent Zero memory for future reference."
                    :disabled="$store.dreamingStore.loading"
                    :class="{ 'loading': $store.dreamingStore.loading }">
              <span class="material-symbols-outlined" style="font-size: 18px;">save</span>
              Save to Memory
            </button>
          </div>
        </div>
        <div class="field">
          <div class="field-label">
            <div class="field-title">Schedule</div>
            <div class="field-description">Automatic dream schedule (requires daemon mode).</div>
          </div>
          <div class="field-control">
            <select x-model="$store.dreamingStore.schedule">
              <option value="manual">Manual Only</option>
              <option value="daily">Daily</option>
              <option value="weekly">Weekly</option>
            </select>
          </div>
        </div>
        <div class="field">
          <div class="field-label">
            <div class="field-title">Status</div>
          </div>
          <div class="field-control">
            <span style="display: flex; align-items: center; gap: 8px;">
              <span class="material-symbols-outlined" style="font-size: 18px;"
                    :style="{ color: $store.dreamingStore.status === 'completed' ? 'var(--color-success)' : 
                             $store.dreamingStore.status === 'error' ? 'var(--color-error)' : 'var(--color-text-secondary)'"
                    x-text="$store.dreamingStore.status === 'detecting' ? 'hourglass_empty' : 
                            $store.dreamingStore.status === 'dreaming' ? 'psychology' :
                            $store.dreamingStore.status === 'completed' ? 'check_circle' :
                            $store.dreamingStore.status === 'error' ? 'error' : 'idle'">
              </span>
              <span x-text="$store.dreamingStore.status === 'idle' ? 'Ready' : 
                           $store.dreamingStore.status === 'detecting' ? 'Detecting errors...' :
                           $store.dreamingStore.status === 'dreaming' ? 'Analyzing patterns...' :
                           $store.dreamingStore.status === 'completed' ? 'Completed' : 'Error'"></span>
              <span style="opacity: 0.6;" x-show="$store.dreamingStore.lastRunTime"
                    x-text="'Last run: ' + $store.dreamingStore.lastRunTime"></span>
            </span>
          </div>
        </div>
      </div>

      <!-- CHECKPOINT SECTION -->
      <div class="section">
        <!-- Header: Title + Clear button on same line -->
        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px;">
          <div>
            <div class="section-title" style="margin-bottom: 0;">Checkpoints (<span x-text="$store.dreamingStore.checkpoints.length"></span>)</div>
            <div class="section-description" style="margin-top: 4px;">Up to 3 backups retained. Restore to rollback before consolidation.</div>
          </div>
          <button class="btn"
                  style="background: var(--color-error-bg, #fee2e2); border: 1px solid var(--color-error, #dc2626); color: var(--color-error, #dc2626);"
                  @click="$store.dreamingStore.clearAllBackups()"
                  :disabled="$store.dreamingStore.loading || $store.dreamingStore.checkpoints.length === 0"
                  title="Delete all checkpoints">
            <span class="material-symbols-outlined" style="font-size: 18px;">delete_forever</span>
            Clear All
          </button>
        </div>

        <!-- Checkpoint Grid -->
        <template x-if="$store.dreamingStore.checkpoints.length === 0">
          <div style="opacity: 0.6; padding: 16px; text-align: center; background: var(--color-bg-secondary); border-radius: 8px;">
            No checkpoints available. Run detection to create one.
          </div>
        </template>
        <template x-if="$store.dreamingStore.checkpoints.length > 0">
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;">
            <template x-for="checkpoint in $store.dreamingStore.checkpoints" :key="checkpoint.id">
              <div style="background: var(--color-bg-secondary); border: 1px solid var(--color-border); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px;">
                <div style="font-weight: 600; font-size: 1.1em;" x-text="'ID: ' + checkpoint.id"></div>
                <div style="opacity: 0.7; font-size: 0.9em;" x-text="$store.dreamingStore.formatTime(checkpoint.created_at)"></div>
                <div style="display: flex; gap: 16px; font-size: 0.9em; padding: 8px 0; border-top: 1px solid var(--color-border); border-bottom: 1px solid var(--color-border);">
                  <div><span style="opacity: 0.7;">Sessions:</span> <strong x-text="checkpoint.sessions_analyzed"></strong></div>
                  <div><span style="opacity: 0.7;">Errors:</span> <strong x-text="checkpoint.errors_found"></strong></div>
                </div>
                <div style="display: flex; gap: 8px;">
                  <button class="btn btn-small" style="flex: 1;" @click="$store.dreamingStore.restore(checkpoint.id)"
                          :disabled="$store.dreamingStore.loading"
                          title="Restore to this checkpoint">
                    <span class="material-symbols-outlined" style="font-size: 16px;">restore</span> Restore
                  </button>
                  <button class="btn btn-small" style="flex: 1;" @click="$store.dreamingStore.consolidate(checkpoint.id)"
                          :disabled="$store.dreamingStore.loading"
                          title="Apply changes from this checkpoint">
                    <span class="material-symbols-outlined" style="font-size: 16px;">check</span> Apply
                  </button>
                </div>
              </div>
            </template>
          </div>
        </template>
      </div>

      <!-- RECOVERY SECTION -->
      <div class="section">
        <div class="section-title">Recovery</div>
        <div class="field">
          <div class="field-label">
            <div class="field-title">Quick Actions</div>
            <div class="field-description">Restore latest checkpoint or clear all backups.</div>
          </div>
          <div class="field-control" style="display: flex; gap: 8px;">
            <button class="btn" @click="$store.dreamingStore.checkpoints.length > 0 && $store.dreamingStore.restore($store.dreamingStore.checkpoints[0].id)"
                    :disabled="$store.dreamingStore.loading || $store.dreamingStore.checkpoints.length === 0"
                    title="Restore from most recent checkpoint">
              <span class="material-symbols-outlined" style="font-size: 18px;">history</span>
              Restore Latest
            </button>
            <button class="btn" 
                    style="background: var(--color-error-bg, #fee2e2); border: 1px solid var(--color-error, #dc2626); color: var(--color-error, #dc2626);"
                    @click="$store.dreamingStore.clearAllBackups()"
                    :disabled="$store.dreamingStore.loading || $store.dreamingStore.checkpoints.length === 0"
                    title="Delete all checkpoints (cannot be undone)">
              <span class="material-symbols-outlined" style="font-size: 18px;">delete_forever</span>
              Clear All Backups
            </button>
          </div>
        </div>
      </div>

      <!-- DETECTED ERRORS SECTION - IMPROVED UI -->
      <div class="section" x-show="$store.dreamingStore.pendingItems.length > 0">
        <div class="section-title">Detected Errors</div>
        <div class="section-description">
          Review and select error patterns to include in consolidation. Checked items will be analyzed and stored in memory for future reference.
        </div>
        <!-- Instruction Header - Full Width Above Results -->
        <div style="margin-bottom: 12px; padding: 10px 16px; background: var(--color-bg-secondary); border-radius: 8px; border: 1px solid var(--color-border); display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
          <span style="font-weight: 600; font-size: 1em;" x-text="'Pending Items (' + $store.dreamingStore.pendingItems.length + ')'"></span>
          <span style="opacity: 0.8; font-size: 0.9em;">💡 Click any row to toggle selection. Use the expand button to view full content.</span>
          <span class="selection-badge" style="margin-left: auto;"
                x-show="$store.dreamingStore.selectedItems.length > 0"
                x-text="$store.dreamingStore.selectedItems.length + ' of ' + $store.dreamingStore.pendingItems.length + ' selected'"></span>
        </div>

        <!-- Selection Controls -->
        <div style="display: flex; gap: 10px; margin-bottom: 12px; align-items: center; flex-wrap: wrap;">
          <button class="btn btn-small"
                  @click="$store.dreamingStore.selectAll()"
                  title="Select all detected errors for consolidation">
            <span class="material-symbols-outlined" style="font-size: 16px;">select_all</span>
            Select All
          </button>
          <button class="btn btn-small"
                  @click="$store.dreamingStore.deselectAll()"
                  title="Deselect all errors">
            <span class="material-symbols-outlined" style="font-size: 16px;">deselect</span>
            Deselect All
          </button>
        </div>

        <!-- Items List - Full Width Below -->
        <div style="max-height: 500px; overflow-y: auto; border: 1px solid var(--color-border); border-radius: 8px; background: var(--color-bg-secondary);">
              <template x-for="(item, index) in $store.dreamingStore.pendingItems" :key="index">
                <div x-data="{ expanded: false }"
                     class="consolidation-item"
                     :class="{ 'selected': $store.dreamingStore.selectedItems.includes(item.entry_no || item.id) }"
                     style="display: flex; align-items: flex-start; gap: 16px; padding: 16px; border-bottom: 1px solid var(--color-border); cursor: pointer;"
                     @click="$store.dreamingStore.toggleItem(item.entry_no || item.id)">
                  
                  <!-- Checkbox - Larger and More Visible -->
                  <input type="checkbox" 
                         :checked="$store.dreamingStore.selectedItems.includes(item.entry_no || item.id)"
                         @change="$store.dreamingStore.toggleItem(item.entry_no || item.id); $event.stopPropagation()"
                         @click="$event.stopPropagation()"
                         title="Include this error in consolidation"
                         style="width: 24px; height: 24px; min-width: 24px; cursor: pointer; accent-color: var(--color-primary, #6366f1); margin-top: 2px;" />
                  
                  <!-- Content Area -->
                  <div style="flex: 1; min-width: 0;">
                    <!-- Header Row -->
                    <div style="display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; flex-wrap: wrap;">
                      <span style="font-weight: 600; font-size: 1em; color: var(--color-text); flex: 1; min-width: 200px;"
                            x-text="item.heading?.substring(0, 80) || 'Error #' + (index + 1)"
                            :title="item.heading"></span>
                      <span style="font-size: 0.85em; opacity: 0.6; white-space: nowrap;"
                            x-show="item.session_name"
                            x-text="'📁 ' + (item.session_name || '')"></span>
                      <span style="font-size: 0.8em; opacity: 0.5; white-space: nowrap;"
                            x-show="item.timestamp"
                            x-text="item.timestamp || ''"></span>
                    </div>
                    
                    <!-- Preview Content (collapsed) -->
                    <div x-show="!expanded"
                         style="font-size: 0.9em; opacity: 0.75; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 8; -webkit-box-orient: vertical; overflow: hidden; color: var(--color-text-secondary);"
                         x-text="item.content?.substring(0, 500) + (item.content?.length > 500 ? '...' : '')"
                         :title="item.content"></div>
                    
                    <!-- Full Content (expanded) -->
                    <div x-show="expanded"
                         style="font-size: 0.9em; opacity: 0.8; line-height: 1.6; white-space: pre-wrap; word-break: break-word; max-height: 300px; overflow-y: auto; padding: 12px; background: var(--color-bg); border-radius: 6px; margin-top: 8px; border: 1px solid var(--color-border);"
                         x-text="item.content || '(no content)'"
                         @click.stop></div>
                    
                    <!-- Action Row -->
                    <div style="display: flex; gap: 10px; margin-top: 10px; align-items: center;">
                      <button class="expand-btn"
                              @click.stop="expanded = !expanded"
                              :title="expanded ? 'Collapse content' : 'Expand to view full content'">
                        <span x-text="expanded ? '▲ Collapse' : '▼ Expand'"></span>
                      </button>
                      <span style="font-size: 0.75em; opacity: 0.5;"
                            x-show="item.content?.length > 350"
                            x-text="(item.content?.length || 0) + ' characters'"></span>
                    </div>
                  </div>
                </div>
              </template>
            </div>
        
        <!-- Execute Button -->
        <div class="field" style="margin-top: 16px;">
          <div class="field-control" style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
            <button class="btn" style="font-size: 1em; padding: 10px 20px; background: var(--color-primary, #6366f1); color: white; border: none;"
                    @click="$store.dreamingStore.executeConsolidation()"
                    :disabled="$store.dreamingStore.loading || $store.dreamingStore.selectedItems.length === 0"
                    title="Process all checked errors and store insights in Agent Zero memory for future reference">
              <span class="material-symbols-outlined" style="font-size: 20px;">playlist_add_check</span>
              Execute Consolidation (<span x-text="$store.dreamingStore.selectedItems.length"></span> selected)
            </button>
            <span style="opacity: 0.7; font-size: 0.9em; color: var(--color-warning, #f59e0b);"
                  x-show="$store.dreamingStore.selectedItems.length === 0">
              ⚠️ Select at least one error to proceed with consolidation
            </span>
          </div>
        </div>
      </div>

    </div>
  </template>
</div>
</body>
</html>
